{% extends 'base.html' %}

{% block title %}
Inicio
{% endblock %}

{% block content %}

<div class="text-center mt-5">

    <h1 class="display-4 fw-bold">
        Sistema Flask
    </h1>

    <p class="lead mt-3">
        Gestión de miembros y tareas
    </p>

</div>

<div class="row mt-5">

    <!-- MIEMBROS -->

    <div class="col-md-6">

        <div class="card shadow h-100">

            <div class="card-body text-center">

                <h2 class="card-title">
                    Miembros
                </h2>

                <p class="card-text">
                    Administrar los miembros del sistema
                </p>

                <a href="{{ url_for('bp_miembro.index') }}"
                   class="btn btn-primary">

                    Ver Miembros

                </a>

            </div>

        </div>

    </div>

    <!-- TAREAS -->

    <div class="col-md-6">

        <div class="card shadow h-100">

            <div class="card-body text-center">

                <h2 class="card-title">
                    Tareas
                </h2>

                <p class="card-text">
                    Administrar tareas pendientes
                </p>

                <a href="{{ url_for('bp_tarea.index') }}"
                   class="btn btn-success">

                    Ver Tareas

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
