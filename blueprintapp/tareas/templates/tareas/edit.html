{% extends 'base.html' %}

{% block content %}

<div class="card shadow p-4">

    <h1 class="mb-4">Editar Tarea</h1>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Descripción
            </label>

            <input type="text"
                   name="descripcion"
                   value="{{ tarea.descripcion }}"
                   class="form-control">

        </div>

        <div class="mb-3 form-check">

            <input type="checkbox"
                   name="completado"
                   class="form-check-input"

                   {% if tarea.completado %}
                   checked
                   {% endif %}
            >

            <label class="form-check-label">
                Completado
            </label>

        </div>

        <button class="btn btn-warning">
            Actualizar
        </button>

    </form>

</div>

{% endblock %}
