{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h1>Nueva Tarea</h1>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Descripción
            </label>

            <input
                type="text"
                name="descripcion"
                class="form-control"
                required
            >

        </div>

        <div class="form-check mb-3">

            <input
                type="checkbox"
                name="completado"
                class="form-check-input"
            >

            <label class="form-check-label">
                Completado
            </label>

        </div>

        <button type="submit"
                class="btn btn-primary">

            Guardar

        </button>

        <a href="{{ url_for('bp_tarea.index') }}"
           class="btn btn-secondary">

            Volver

        </a>

    </form>

</div>

{% endblock %}
