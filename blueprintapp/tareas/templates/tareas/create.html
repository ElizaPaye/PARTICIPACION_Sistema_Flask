{% extends 'base.html' %}

{% block content %}

<div class="card shadow p-4">

    <h1 class="mb-4">Crear Tarea</h1>

    <form action="{{ url_for('bp_tarea.create') }}" method="POST">

        <div class="mb-3">

            <label class="form-label">
                Descripción
            </label>

            <input type="text"
                   name="descripcion"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3 form-check">

            <input type="checkbox"
                   name="completado"
                   class="form-check-input">

            <label class="form-check-label">
                Completado
            </label>

        </div>

        <button class="btn btn-success">
            Guardar
        </button>

    </form>

</div>

{% endblock %}
