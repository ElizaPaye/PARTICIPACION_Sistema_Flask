{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h1>Lista de Tareas</h1>

    <a href="{{ url_for('bp_tarea.create') }}"
       class="btn btn-success mb-3">
        Nueva tarea
    </a>

    <table class="table table-bordered">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Descripción</th>
                <th>Completado</th>
                <th>Complementos</th>
            </tr>
        </thead>

        <tbody>

            {% for tarea in tareas %}
            <tr>

                <td>{{ tarea.id }}</td>

                <td>{{ tarea.descripcion }}</td>

                <td>
                    {% if tarea.completado %}
                        Sí
                    {% else %}
                        No
                    {% endif %}
                </td>

                <td>
                    <a href="{{ url_for('bp_tarea.edit', id=tarea.id) }}"
                    class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <a href="{{ url_for('bp_tarea.delete', id=tarea.id) }}"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('¿Eliminar tarea?')">
                        Eliminar
                    </a>
                </td>

            </tr>
            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
