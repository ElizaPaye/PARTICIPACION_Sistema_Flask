<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Gestión de Miembros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

    <h1 class="text-center mb-4">
        GESTIÓN DE MIEMBROS
    </h1>

    <a href="/" class="btn btn-secondary mb-3">
        Volver
    </a>

    <form action="/miembros/agregar" method="POST" class="mb-4">

        <input
            type="text"
            name="nombre"
            placeholder="Nombre"
            class="form-control mb-2"
            required
        >

        <input
            type="email"
            name="correo"
            placeholder="Correo"
            class="form-control mb-2"
            required
        >

        <button class="btn btn-primary">
            Agregar Miembro
        </button>

    </form>

    <table class="table table-bordered">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Acciones</th>

            </tr>

        </thead>

        <tbody>

            {% for miembro in miembros %}

            <tr>

                <td>{{ miembro.id }}</td>

                <td>{{ miembro.nombre }}</td>

                <td>{{ miembro.correo }}</td>

                <td>

                    <a
                        href="/miembros/editar/{{ miembro.id }}"
                        class="btn btn-warning btn-sm"
                    >
                        Editar
                    </a>

                    <a
                        href="/miembros/eliminar/{{ miembro.id }}"
                        class="btn btn-danger btn-sm"
                    >
                        Eliminar
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>
</html>
