<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Editar Miembro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

    <h1 class="mb-4">
        EDITAR MIEMBRO
    </h1>

    <form method="POST">

        <input
            type="text"
            name="nombre"
            value="{{ miembro.nombre }}"
            class="form-control mb-3"
            required
        >

        <input
            type="email"
            name="correo"
            value="{{ miembro.correo }}"
            class="form-control mb-3"
            required
        >

        <button class="btn btn-primary">
            Guardar Cambios
        </button>

        <a href="/miembros" class="btn btn-secondary">
            Volver
        </a>

    </form>

</body>
</html>
