{% extends 'base.html' %}

{% block title %}
Crear Miembro
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3 class="mb-0">
                    Crear Miembro
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            name="nombre"
                            class="form-control"
                            placeholder="Ingrese nombre"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Correo
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Ingrese correo"
                            required
                        >

                    </div>

                    <button type="submit"
                            class="btn btn-primary">

                        Guardar

                    </button>

                    <a href="{{ url_for('bp_miembro.index') }}"
                       class="btn btn-secondary">

                        Volver

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
