{% extends 'base.html' %}

{% block title %}Editar Miembro{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">

            <div class="card-header bg-warning text-white">
                <h3>Editar Miembro</h3>
            </div>

            <div class="card-body">
                <form method="POST">

                    <div class="mb-3">
                        <label>Nombre</label>
                        <input type="text"
                               name="nombre"
                               value="{{ miembro.nombre }}"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email"
                               name="email"
                               value="{{ miembro.email }}"
                               class="form-control"
                               required>
                    </div>

                    <button class="btn btn-primary">Actualizar</button>

                    <a href="{{ url_for('bp_miembro.index') }}"
                       class="btn btn-secondary">
                        Volver
                    </a>

                </form>
            </div>

        </div>
    </div>
</div>

{% endblock %}
