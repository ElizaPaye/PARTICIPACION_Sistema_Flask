{% extends 'base.html' %}

{% block title %}
Miembros
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h1>
        Listado de Miembros
    </h1>

    <a href="{{ url_for('bp_miembro.create') }}"
       class="btn btn-success">
        Nuevo Miembro

    </a>

</div>

<div class="card shadow">

    <div class="card-body">

        <table class="table table-hover table-striped">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                   
                </tr>

            </thead>

            <tbody>

                {% for miembro in miembros %}

                <tr>

                    <td>{{ miembro.id }}</td>

                    <td>{{ miembro.nombre }}</td>

                    <td>{{ miembro.email }}</td>
                    

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
